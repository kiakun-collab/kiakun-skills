interface:
  display_name: "PPT Rebuild Workflow"
  short_description: "Rebuild reference slides into editable PPTX."
  default_prompt: "Use $ppt-rebuild-workflow to rebuild these slides. Default to balanced editable reconstruction. Treat user-provided final copy as authoritative for its specified scope. Route from user intent, extract once, build and render, then calibrate only risky pages or styles; preserve readability and fidelity checks."

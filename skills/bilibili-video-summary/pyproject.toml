[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-video-summary"
version = "0.2.0"
description = "拉取 B站视频字幕/弹幕/评论/信号，预消化为 ≤15KB JSON 供 LLM 生成决策导向总结。"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "bilibili-api-python>=1.6.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
# Whisper 兜底转写（无 CC 字幕时）；另需系统 ffmpeg。
whisper = ["faster-whisper>=1.0.0"]
dev = ["pytest>=7"]

# scripts/ 是独立脚本集合，非可导入包。
[tool.setuptools]
packages = []

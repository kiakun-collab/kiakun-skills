<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; font-family: Arial, sans-serif; background: #f5f5f5; }
  #card {
    position: absolute; left: 100px; top: 100px; width: 400px; height: 200px;
    background: linear-gradient(90deg, #ff0000 0%, #0000ff 100%);
    border-radius: 16px; border: 2px solid #00ff00;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  #card .label { position: absolute; left: 24px; top: 24px; font-size: 24px; color: #ffffff; font-weight: 600; }
</style></head>
<body>
  <div id="card"><div class="label">Card Title</div></div>
</body>
</html>

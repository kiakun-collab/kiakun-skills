<!doctype html>
<html>
<head><meta charset="utf-8"><style>

  #grid { position: absolute; left: 80px; top: 200px; border-collapse: collapse; }

<body>
  <svg id="icon" width="48" height="48" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="20" fill="#3366cc"></circle>
  </svg>
  <table id="grid">
    <tr><td>A1</td><td>B1</td></tr>
    <tr><td>A2</td><td>B2</td></tr>
  </table>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #05060a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 渲染契约：画面只由 t 决定。不读系统时间，随机数固定 seed，渲染中不加载资源。
window.__duration = 6;
window.__fps = 30;

const cv = document.getElementById('c');
const W = cv.width = innerWidth, H = cv.height = innerHeight;
const ctx = cv.getContext('2d');

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rnd = mulberry32(42);
const stars = Array.from({ length: 600 }, () => ({ x: rnd(), y: rnd(), r: rnd() * 2 + 0.5, p: rnd() * 6.28 }));

const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const fade = (t, a, b) => ease((t - a) / (b - a));

// 字幕：每个镜头一句，放在安全区内
const shots = [
  { from: 0, to: 3, text: '你看到的每一颗星' },
  { from: 3, to: 6, text: '都是一行代码' },
];

window.__renderFrame = (t) => {
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    const a = 0.3 + 0.7 * Math.abs(Math.sin(s.p + t * 1.5));
    ctx.fillStyle = `rgba(200,220,255,${a * fade(t, 0, 1.2)})`;
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 6.28); ctx.fill();
  }
  for (const s of shots) {
    const k = Math.min(fade(t, s.from, s.from + 0.4), 1 - fade(t, s.to - 0.4, s.to));
    if (k <= 0) continue;
    ctx.globalAlpha = k;
    ctx.fillStyle = '#fff';
    ctx.font = `600 ${Math.round(W * 0.07)}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(s.text, W / 2, H * 0.62 + (1 - k) * 20);
    ctx.globalAlpha = 1;
  }
};
</script>
</body>
</html>
